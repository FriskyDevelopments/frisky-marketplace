name: secret-scan

# Guard against accidentally committing real credentials into plugin configs.
# Runs on every push and pull request. Uses only Python stdlib — no network,
# no extra dependencies to install.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run scanner self-tests
        run: python3 scripts/test_scan_secrets.py

      - name: Scan plugin configs for secrets
        run: python3 scripts/scan_secrets.py --root .

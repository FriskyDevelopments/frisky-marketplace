name: secret-scan
on:
  push:
  pull_request:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  gitleaks:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  trufflehog:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
  # PR #5 leaked through the PR BODY, not files. Scan PR title/body text too.
  pr-body:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Scan PR title and body (no checkout of PR code)
        env:
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TEXT" > /tmp/pr.txt
          if grep -Eiq '\b[A-Z0-9_]*(API_KEY|TOKEN|PASSWORD|PASS|SECRET)\b[[:space:]]*[=:][[:space:]]*["'"'"']?[A-Za-z0-9_./+=:@-]{12,}' /tmp/pr.txt; then
            echo "::error::PR title/body looks like it contains a secret value. Edit it out, then rotate the key (edit history keeps it)."
            exit 1
          fi
